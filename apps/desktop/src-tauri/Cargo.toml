[package]
name = "talkin-desktop"
version = "0.1.0"
description = "Talkin — gravador de reuniões online"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
# WASAPI loopback (áudio do sistema) — captura nativa isolada
windows = { version = "0.58", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# ScreenCaptureKit / Core Audio via bindings objc
objc2 = "0.5"
